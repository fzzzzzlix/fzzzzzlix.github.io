name: Deploy to GitHub Pages

# Builds the vinext app as a static export and publishes dist/client to Pages.
# Requires: repo Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # QA gate: lint, cross-file data validation, and tests must all pass
      # before we build and deploy. No continue-on-error: any failure blocks
      # the deploy job (which `needs: build`).
      - name: Lint
        run: npm run lint

      - name: Validate portfolio data
        run: npm run validate:portfolio

      - name: Build static export
        run: npm run build:pages

      # Run the rendered-HTML tests against the export output built above
      # (dist/server/index.js). Equivalent to `npm test` without rebuilding.
      - name: Test
        run: npm run test:only

      # GitHub Pages runs Jekyll by default, which drops files/dirs beginning
      # with an underscore. Disable it so every built asset is served as-is.
      - name: Disable Jekyll
        run: touch dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
